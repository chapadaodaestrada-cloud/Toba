services:
  - type: web
    name: magisterio-beneficios
    runtime: node
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    buildCommand: >-
      cd frontend && npm ci --include=dev && npm run build &&
      cd ../backend && npm ci --include=dev && npm run db:generate && npm run build
    startCommand: cd backend && npm run db:deploy && npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: UPLOAD_DIR
        value: ./uploads
      - key: JWT_USER_SECRET
        generateValue: true
      - key: JWT_ADMIN_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
