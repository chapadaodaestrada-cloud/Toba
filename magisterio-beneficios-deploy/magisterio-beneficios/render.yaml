# Blueprint do Render: um único serviço gratuito (API + site).
# O banco fica no Neon (gratuito); veja docs/DEPLOY-GRATUITO.md.
services:
  - type: web
    name: magisterio-beneficios
    runtime: node
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    buildCommand: >-
      cd frontend && npm ci --include=dev && npm run build &&
      cd ../backend && npm ci --include=dev && npm run db:generate && npm run build
    startCommand: cd backend && npm run db:deploy && npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "true"          # mostra o aviso de "dados demonstrativos"; use false em produção real
      - key: UPLOAD_DIR
        value: ./uploads        # disco do plano gratuito é efêmero: uploads somem ao reiniciar
      - key: JWT_USER_SECRET
        generateValue: true
      - key: JWT_ADMIN_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false             # string de conexão DIRETA do Neon (sem "-pooler")
      - key: CORS_ORIGIN
        sync: false             # https://SEU-SERVICO.onrender.com
