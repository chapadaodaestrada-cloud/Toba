# PostgreSQL para desenvolvimento/homologação. Em produção use credenciais próprias e backups.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: magisterio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: magisterio
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
